name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Migrations apply to an empty database
        run: |
          HOMESTEAD_DATA_DIR=./ci-data node apps/server/dist/cli.js migrate
          HOMESTEAD_DATA_DIR=./ci-data node apps/server/dist/cli.js seed
      - name: Backup and restore round trip
        run: |
          HOMESTEAD_DATA_DIR=./ci-data node apps/server/dist/cli.js seed-demo --force
          HOMESTEAD_DATA_DIR=./ci-data node apps/server/dist/cli.js backup --out=./ci-backup.db
          HOMESTEAD_DATA_DIR=./ci-restored node apps/server/dist/cli.js restore --from=./ci-backup.db
          HOMESTEAD_DATA_DIR=./ci-restored node apps/server/dist/cli.js status

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/homestead:latest
